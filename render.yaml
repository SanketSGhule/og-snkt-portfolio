services:
  - type: web
    name: ogsnkt-portfolio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_PASSWORD
        value: ogsnkt2024
      - key: SESSION_SECRET
        generateValue: true
