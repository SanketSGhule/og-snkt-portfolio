<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG.SNKT — Admin Panel</title>
  <link rel="stylesheet" href="/css/style.css?v=2.6">
  <link rel="stylesheet" href="/css/admin.css?v=2.6">
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div class="admin-login" id="loginScreen">
    <div class="login-card">
      <h1>OG.SNKT</h1>
      <p>Admin Access</p>
      <form id="loginForm">
        <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="current-password" required>
        <button type="submit">Login</button>
      </form>
      <p class="login-error" id="loginError"></p>
    </div>
  </div>

  <!-- ADMIN DASHBOARD (hidden until login) -->
  <div class="admin-dashboard" id="dashboard" style="display:none">
    <!-- Top bar -->
    <header class="admin-header">
      <div class="admin-brand">OG.SNKT <span class="admin-badge">ADMIN</span></div>
      <div class="admin-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
        <a href="/" class="btn-secondary" target="_blank">View Site</a>
        <button class="btn-danger" id="logoutBtn">Logout</button>
      </div>
    </header>

    <!-- TABS -->
    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="upload">Upload</button>
      <button class="tab-btn" data-tab="manage">Manage Items</button>
      <button class="tab-btn" data-tab="categories">Categories</button>
    </div>

    <!-- TAB: UPLOAD -->
    <div class="tab-content active" id="tab-upload">
      <!-- Upload Mode Switcher -->
      <div class="upload-mode-toggle">
        <button type="button" class="upload-mode-btn active" id="modeBtnFile">📱 Upload from Phone</button>
        <button type="button" class="upload-mode-btn" id="modeBtnUrl">🔗 Paste Media Link</button>
      </div>

      <!-- Mode 1: File from Phone Gallery / Camera -->
      <div id="fileUploadContainer">
        <label for="fileInput" class="upload-zone" id="uploadZone">
          <div class="upload-icon">📁</div>
          <p>Tap here to pick photo or video from your phone</p>
          <input type="file" id="fileInput" accept="image/*,video/*" style="position:absolute; opacity:0; width:0.1px; height:0.1px; overflow:hidden;">
          <p class="upload-hint">Supports Photos (JPG, PNG, WebP) & Videos (MP4, MOV)</p>
        </label>
        <!-- Selected file preview -->
        <div class="upload-preview" id="uploadPreview"></div>
      </div>

      <!-- Mode 2: Paste Direct URL -->
      <div id="urlUploadContainer" style="display:none">
        <div class="url-input-box">
          <label class="form-label" style="font-weight:600;">Media URL (Image or Video MP4):</label>
          <input type="url" id="uploadMediaUrl" placeholder="https://example.com/video.mp4 or image.jpg">
          <label class="form-label" style="margin-top:10px; font-weight:600;">Thumbnail URL (Optional for videos):</label>
          <input type="url" id="uploadThumbUrl" placeholder="https://example.com/thumbnail.jpg">
        </div>
      </div>

      <!-- Form details -->
      <div class="upload-form" id="uploadForm">
        <input type="text" id="uploadTitle" placeholder="Project Title (required)" required>
        <textarea id="uploadDesc" placeholder="Description / Narrative (optional)" rows="3"></textarea>
        
        <label class="form-label" style="font-weight:600; margin-top:4px;">Category:</label>
        <select id="uploadCategory"></select>

        <div class="form-group side-selector-group">
          <label class="form-label">Portfolio Side:</label>
          <div class="side-radio-group" id="uploadSideGroup">
            <label class="side-radio-btn active">
              <input type="radio" name="uploadSide" value="BOTH" checked>
              <span>🔀 Both Sides</span>
            </label>
            <label class="side-radio-btn">
              <input type="radio" name="uploadSide" value="A">
              <span>🅰 Side A (Silent)</span>
            </label>
            <label class="side-radio-btn">
              <input type="radio" name="uploadSide" value="B">
              <span>🅱 Side B (Overdrive)</span>
            </label>
          </div>
        </div>

        <button class="btn-primary" id="uploadBtn">Publish to Portfolio</button>
        <div class="progress-bar" id="progressBar" style="display:none">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="upload-status-text" id="uploadStatusText" style="display:none"></p>
      </div>
    </div>

    <!-- TAB: MANAGE ITEMS -->
    <div class="tab-content" id="tab-manage">
      <div class="manage-toolbar">
        <div class="manage-filters">
          <select id="manageFilter"><option value="all">All Categories</option></select>
          <select id="manageSideFilter">
            <option value="all">All Sides (A, B & Both)</option>
            <option value="A">Side A (Minimal)</option>
            <option value="B">Side B (Overdrive)</option>
          </select>
        </div>
        <button class="btn-danger" id="bulkDeleteBtn" style="display:none">Delete Selected</button>
      </div>
      <div class="manage-grid" id="manageGrid">
        <!-- Sortable grid of items -->
      </div>
      <div class="manage-empty" id="manageEmpty" style="display:none">
        <p>No items yet. Go to Upload tab to add some!</p>
      </div>
    </div>

    <!-- TAB: CATEGORIES -->
    <div class="tab-content" id="tab-categories">
      <div class="category-add">
        <input type="text" id="newCategoryInput" placeholder="New category name">
        <button class="btn-primary" id="addCategoryBtn">Add Category</button>
      </div>
      <div class="category-list" id="categoryList">
        <!-- Sortable list of categories -->
      </div>
    </div>
  </div>

  <!-- EDIT MODAL -->
  <div class="modal" id="editModal" style="display:none">
    <div class="modal-content">
      <h2>Edit Item</h2>
      <input type="text" id="editTitle" placeholder="Title">
      <textarea id="editDesc" placeholder="Description" rows="3"></textarea>
      <select id="editCategory"></select>
      <div class="form-group side-selector-group">
        <label class="form-label">Portfolio Side:</label>
        <div class="side-radio-group" id="editSideGroup">
          <label class="side-radio-btn">
            <input type="radio" name="editSide" value="BOTH">
            <span>🔀 Both Sides</span>
          </label>
          <label class="side-radio-btn">
            <input type="radio" name="editSide" value="A">
            <span>🅰 Side A (Minimal)</span>
          </label>
          <label class="side-radio-btn">
            <input type="radio" name="editSide" value="B">
            <span>🅱 Side B (Aggressive)</span>
          </label>
        </div>
      </div>

      <!-- Video Thumbnail Picker (shown if item is video) -->
      <div class="form-group edit-video-thumb-group" id="editVideoThumbGroup" style="display:none;">
        <label class="form-label" style="font-weight:600; margin-bottom:6px; display:block;">Thumbnail / Poster:</label>
        <div class="edit-thumb-preview-row">
          <div class="edit-thumb-preview-box" id="editThumbPreviewBox">
            <img id="editThumbPreviewImg" src="" alt="Thumbnail preview" style="display:none;">
            <span id="editThumbPlaceholder" style="color:var(--text-muted); font-size:0.8rem;">No thumbnail set</span>
          </div>
          <div class="edit-thumb-actions">
            <button type="button" class="btn-secondary btn-sm" id="editCaptureVideoBtn">
              📸 Pick Frame from Video
            </button>
            <input type="url" id="editCustomThumbUrl" placeholder="Or custom image URL" style="font-size:0.82rem; margin-top:6px;">
          </div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" id="editCancel">Cancel</button>
        <button class="btn-primary" id="editSave">Save</button>
      </div>
    </div>
  </div>

  <!-- VIDEO THUMBNAIL CAPTURE MODAL -->
  <div class="modal" id="videoThumbModal" style="display:none">
    <div class="modal-content modal-lg">
      <div class="modal-header-row">
        <h2>Capture Thumbnail from Video</h2>
        <button type="button" class="modal-close-icon" id="videoThumbCloseBtn" aria-label="Close">&times;</button>
      </div>
      <p class="modal-subtitle" id="videoThumbItemTitle">Scrub through the video to pick the best frame as the portfolio poster.</p>

      <!-- Video Player & Scrubber Viewport -->
      <div class="video-thumb-viewport">
        <video id="thumbVideoPlayer" preload="auto" playsinline muted crossorigin="anonymous"></video>
        <div class="video-thumb-overlay-time" id="videoThumbTimecode">00:00.0 / 00:00.0</div>
      </div>

      <!-- Scrubber Timeline Controls -->
      <div class="video-scrubber-wrap">
        <div class="scrubber-slider-row">
          <input type="range" class="video-scrubber-slider" id="videoScrubberSlider" min="0" max="100" step="0.05" value="0">
        </div>
        <div class="scrubber-quick-presets">
          <button type="button" class="preset-btn" data-time="0">0s (Start)</button>
          <button type="button" class="preset-btn" data-time="1">1s</button>
          <button type="button" class="preset-btn" data-pct="25">25%</button>
          <button type="button" class="preset-btn" data-pct="50">50% (Mid)</button>
          <button type="button" class="preset-btn" data-pct="75">75%</button>
          <div class="scrubber-step-buttons">
            <button type="button" class="preset-btn" id="btnStepBack" title="Step back 0.5s">⏮ -0.5s</button>
            <button type="button" class="preset-btn" id="btnStepFwd" title="Step forward 0.5s">+0.5s ⏭</button>
          </div>
        </div>
      </div>

      <!-- Captured Frame Preview Box -->
      <div class="captured-preview-section">
        <div class="captured-preview-title">Selected Frame Preview:</div>
        <div class="captured-preview-box">
          <canvas id="thumbCaptureCanvas" style="display:none;"></canvas>
          <img id="thumbCapturePreviewImg" src="" alt="Captured Frame Preview" style="display:none;">
          <div class="captured-preview-badge" id="capturedFrameBadge">Ready</div>
        </div>
      </div>

      <!-- Status text & Actions -->
      <div class="video-thumb-status" id="videoThumbStatus" style="display:none;"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="videoThumbCancel">Cancel</button>
        <button type="button" class="btn-primary" id="videoThumbSaveBtn">
          💾 Save as Item Thumbnail
        </button>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script src="/js/admin.js?v=2.6"></script>
</body>
</html>
