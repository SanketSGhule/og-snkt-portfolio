<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG.SNKT — Admin Panel</title>
  <link rel="stylesheet" href="/css/style.css?v=3.0">
  <link rel="stylesheet" href="/css/admin.css?v=3.0">
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div class="admin-login" id="loginScreen">
    <div class="login-card">
      <h1>OG.SNKT</h1>
      <p>Admin Access</p>
      <form id="loginForm">
        <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="current-password" required>
        <button type="submit">Login</button>
      </form>
      <p class="login-error" id="loginError"></p>
    </div>
  </div>

  <!-- ADMIN DASHBOARD (hidden until login) -->
  <div class="admin-dashboard" id="dashboard" style="display:none">
    <!-- Top bar -->
    <header class="admin-header">
      <div class="admin-brand">OG.SNKT <span class="admin-badge">ADMIN</span></div>
      <div class="admin-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
        <a href="/" class="btn-secondary" target="_blank">View Site</a>
        <button class="btn-danger" id="logoutBtn">Logout</button>
      </div>
    </header>

    <!-- TABS -->
    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="upload">Upload</button>
      <button class="tab-btn" data-tab="manage">Manage Items</button>
      <button class="tab-btn" data-tab="categories">Categories</button>
    </div>

    <!-- TAB: UPLOAD -->
    <div class="tab-content active" id="tab-upload">
      <!-- Upload Mode Switcher -->
      <div class="upload-mode-toggle">
        <button type="button" class="upload-mode-btn active" id="modeBtnFile">📱 Upload from Phone</button>
        <button type="button" class="upload-mode-btn" id="modeBtnUrl">🔗 Paste Media Link</button>
      </div>

      <!-- Mode 1: File from Phone Gallery / Camera -->
      <div id="fileUploadContainer">
        <label for="fileInput" class="upload-zone" id="uploadZone">
          <div class="upload-icon">📁</div>
          <p>Tap here to pick photo or video from your phone</p>
          <input type="file" id="fileInput" accept="image/*,video/*" style="position:absolute; opacity:0; width:0.1px; height:0.1px; overflow:hidden;">
          <p class="upload-hint">Supports Photos (JPG, PNG, WebP) & Videos (MP4, MOV)</p>
        </label>
        <!-- Selected file preview -->
        <div class="upload-preview" id="uploadPreview"></div>
      </div>

      <!-- Mode 2: Paste Direct URL -->
      <div id="urlUploadContainer" style="display:none">
        <div class="url-input-box">
          <label class="form-label" style="font-weight:600;">Media URL (Image or Video MP4):</label>
          <input type="url" id="uploadMediaUrl" placeholder="https://example.com/video.mp4 or image.jpg">

        </div>
      </div>

      <!-- Form details -->
      <div class="upload-form" id="uploadForm">
        <input type="text" id="uploadTitle" placeholder="Project Title (required)" required>
        <textarea id="uploadDesc" placeholder="Description / Narrative (optional)" rows="3"></textarea>

        <!-- Thumbnail Section (Controls resting tile aspect ratio) -->
        <div class="form-group thumbnail-upload-section" id="thumbUploadSection">
          <label class="form-label" style="font-weight:600; display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
            <span>Custom Thumbnail Image <small style="font-weight:normal; opacity:0.75;">(Determines resting tile pixel ratio)</small></span>
            <span class="badge-optional" style="font-size:0.7rem; padding:2px 8px; border-radius:999px; background:rgba(255,107,53,0.15); color:var(--accent); font-weight:600;">RECOMMENDED FOR VIDEOS</span>
          </label>
          <div class="thumb-upload-box" id="thumbUploadBox">
            <label for="thumbFileInput" class="thumb-drop-zone" id="thumbDropZone">
              <span class="thumb-drop-icon">🖼️</span>
              <span class="thumb-drop-text">Pick thumbnail image from phone (JPG/PNG/WebP)</span>
              <input type="file" id="thumbFileInput" accept="image/*" style="display:none;">
            </label>
            <div class="thumb-preview-wrap" id="thumbPreviewWrap" style="display:none;">
              <img id="thumbPreviewImg" src="" alt="Thumbnail preview">
              <div class="thumb-preview-info">
                <span id="thumbPreviewName" class="thumb-preview-name"></span>
                <span id="thumbPreviewRatio" class="thumb-ratio-tag"></span>
                <button type="button" class="btn-thumb-remove" id="btnRemoveThumb" title="Remove thumbnail">✕ Remove</button>
              </div>
            </div>
          </div>
          <div id="thumbUrlWrap" style="display:none; margin-top:8px;">
            <input type="url" id="uploadThumbUrl" placeholder="Or enter Thumbnail Image URL (optional)">
          </div>
        </div>
        
        <label class="form-label" style="font-weight:600; margin-top:4px;">Category:</label>
        <select id="uploadCategory"></select>

        <div class="form-group side-selector-group">
          <label class="form-label">Portfolio Side:</label>
          <div class="side-radio-group" id="uploadSideGroup">
            <label class="side-radio-btn active">
              <input type="radio" name="uploadSide" value="BOTH" checked>
              <span>🔀 Both Sides</span>
            </label>
            <label class="side-radio-btn">
              <input type="radio" name="uploadSide" value="A">
              <span>🅰 Side A (Silent)</span>
            </label>
            <label class="side-radio-btn">
              <input type="radio" name="uploadSide" value="B">
              <span>🅱 Side B (Overdrive)</span>
            </label>
          </div>
        </div>

        <button class="btn-primary" id="uploadBtn">Publish to Portfolio</button>
        <div class="progress-bar" id="progressBar" style="display:none">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="upload-status-text" id="uploadStatusText" style="display:none"></p>
      </div>
    </div>

    <!-- TAB: MANAGE ITEMS -->
    <div class="tab-content" id="tab-manage">
      <div class="manage-toolbar">
        <div class="manage-filters">
          <select id="manageFilter"><option value="all">All Categories</option></select>
          <select id="manageSideFilter">
            <option value="all">All Sides (A, B & Both)</option>
            <option value="A">Side A (Minimal)</option>
            <option value="B">Side B (Overdrive)</option>
          </select>
        </div>
        <button class="btn-danger" id="bulkDeleteBtn" style="display:none">Delete Selected</button>
      </div>
      <div class="manage-grid" id="manageGrid">
        <!-- Sortable grid of items -->
      </div>
      <div class="manage-empty" id="manageEmpty" style="display:none">
        <p>No items yet. Go to Upload tab to add some!</p>
      </div>
    </div>

    <!-- TAB: CATEGORIES -->
    <div class="tab-content" id="tab-categories">
      <div class="category-add">
        <input type="text" id="newCategoryInput" placeholder="New category name">
        <button class="btn-primary" id="addCategoryBtn">Add Category</button>
      </div>
      <div class="category-list" id="categoryList">
        <!-- Sortable list of categories -->
      </div>
    </div>
  </div>

  <!-- EDIT MODAL -->
  <div class="modal" id="editModal" style="display:none">
    <div class="modal-content">
      <h2>Edit Item</h2>
      <input type="text" id="editTitle" placeholder="Title">
      <textarea id="editDesc" placeholder="Description" rows="3"></textarea>
      <select id="editCategory"></select>

      <!-- Edit Thumbnail Section -->
      <div class="form-group edit-thumb-section" style="margin-top:10px;">
        <label class="form-label" style="font-weight:600; display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
          <span>Thumbnail Image</span>
          <small style="opacity:0.75;">(Resting tile aspect ratio)</small>
        </label>
        <div class="edit-thumb-container" style="display:flex; gap:12px; align-items:center;">
          <div class="edit-thumb-preview-box" id="editThumbPreviewBox" style="width:84px; height:56px; border-radius:8px; background:var(--bg-secondary); border:1px solid var(--border); overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <img id="editThumbImg" src="" alt="Current thumbnail" style="width:100%; height:100%; object-fit:cover; display:none;">
            <span id="editThumbPlaceholder" style="font-size:0.75rem; color:var(--text-secondary); text-align:center; padding:4px;">No Thumb</span>
          </div>
          <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
            <label for="editThumbFileInput" class="btn-secondary" style="display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; font-size:0.82rem; padding:8px 12px; border-radius:6px; text-align:center;">
              <span>📁 Upload / Replace Thumbnail</span>
              <input type="file" id="editThumbFileInput" accept="image/*" style="display:none;">
            </label>
            <button type="button" class="btn-text" id="editThumbRemoveBtn" style="font-size:0.75rem; color:#ef4444; background:none; border:none; cursor:pointer; text-align:left; padding:2px 0; display:none;">✕ Remove Thumbnail</button>
          </div>
        </div>
        <input type="url" id="editThumbUrlInput" placeholder="Or paste Thumbnail Image URL" style="margin-top:8px; font-size:0.85rem;">
      </div>

      <div class="form-group side-selector-group">
        <label class="form-label">Portfolio Side:</label>
        <div class="side-radio-group" id="editSideGroup">
          <label class="side-radio-btn">
            <input type="radio" name="editSide" value="BOTH">
            <span>🔀 Both Sides</span>
          </label>
          <label class="side-radio-btn">
            <input type="radio" name="editSide" value="A">
            <span>🅰 Side A (Minimal)</span>
          </label>
          <label class="side-radio-btn">
            <input type="radio" name="editSide" value="B">
            <span>🅱 Side B (Aggressive)</span>
          </label>
        </div>
      </div>


      <div class="modal-actions">
        <button class="btn-secondary" id="editCancel">Cancel</button>
        <button class="btn-primary" id="editSave">Save</button>
      </div>
    </div>
  </div>


  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script src="/js/admin.js?v=3.0"></script>
</body>
</html>
